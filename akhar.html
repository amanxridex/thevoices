<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AKHAR • SUPER D</title>
  <link rel="stylesheet" href="akhar.css">
</head>
<body>

<header class="top">
  <h1>SUPER <span>D</span></h1>
</header>

<!-- TOGGLE -->
<div class="toggle">
  <button class="active">AKHAR</button>
  <button onclick="location.href='jodi.html'">JODI</button>
</div>

<h2 class="subtitle">Select Akhar & Enter Amount</h2>

<!-- NUMBER GRID -->
<div class="grid" id="numberGrid"></div>

<!-- PREVIEW -->
<div class="preview">
  <h3>Bet Preview</h3>
  <div id="betList"></div>
  <hr>
  <p class="total">Total: ₹ <span id="totalAmount">0</span></p>
</div>

<button class="submit">SUBMIT BET</button>

<script>
const API = "https://matka-backend-4fy1.onrender.com";
const token = localStorage.getItem("userToken");

function loadUserBalance() {
  fetch(API + "/user/me", {
    headers: {
      Authorization: "Bearer " + token
    }
  })
  .then(res => {
    if (!res.ok) {
      location.href = "user-login.html";
      return;
    }
    return res.json();
  })
  .then(user => {
    if (!user) return;
    document.getElementById("userBalance").innerText = user.balance;
  });
}

loadUserBalance();
</script>

<script>
const API = "https://matka-backend-4fy1.onrender.com";
const token = localStorage.getItem("userToken");

function loadUserBalance() {
  fetch(API + "/user/me", {
    headers: {
      Authorization: "Bearer " + token
    }
  })
  .then(res => {
    if (!res.ok) {
      location.href = "user-login.html";
      return;
    }
    return res.json();
  })
  .then(user => {
    if (!user) return;
    document.getElementById("userBalance").innerText = user.balance;
  });
}

loadUserBalance();
</script>

<script>
const grid = document.getElementById("numberGrid");
const betList = document.getElementById("betList");
const totalAmountEl = document.getElementById("totalAmount");

const bets = {}; // { digit: amount }

for (let i = 0; i <= 9; i++) {
  const box = document.createElement("div");
  box.className = "box";
  box.innerHTML = `
    <b>${i}</b>
    <input type="number" min="0" placeholder="₹"
      oninput="updateBet(${i}, this.value)">
  `;
  grid.appendChild(box);
}

function updateBet(digit, value) {
  const amt = Number(value);

  if (amt > 0) {
    bets[digit] = amt;
  } else {
    delete bets[digit];
  }

  renderPreview();
}

function renderPreview() {
  betList.innerHTML = "";
  let total = 0;

  Object.keys(bets).forEach(digit => {
    const amt = bets[digit];
    total += amt;

    betList.innerHTML += `
      <p>${digit} → ₹ ${amt}</p>
    `;
  });

  totalAmountEl.innerText = total;
}
</script>

</body>
</html>
