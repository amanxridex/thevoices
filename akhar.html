<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AKHAR • SUPER D</title>
  <link rel="stylesheet" href="akhar.css">
</head>
<body>

<header class="top">
  <h1>SUPER <span>D</span></h1>
</header>

<!-- TOGGLE -->
<div class="toggle">
  <button class="active">AKHAR</button>
  <button onclick="location.href='jodi.html'">JODI</button>
</div>

<h2 class="subtitle">Select Akhar & Enter Amount</h2>

<!-- USER BALANCE -->
<div class="user-balance-box">
  Available Balance: ₹ <span id="userBalance">0</span>
</div>

<!-- NUMBER GRID -->
<div class="grid" id="numberGrid"></div>

<!-- PREVIEW -->
<div class="preview">
  <h3>Bet Preview</h3>
  <div id="betList"></div>
  <hr>
  <p class="total">Total: ₹ <span id="totalAmount">0</span></p>
</div>

<button class="submit-btn" onclick="submitBet()">SUBMIT BET</button>

<script>
const API = "https://matka-backend-4fy1.onrender.com";
const token = localStorage.getItem("userToken");

if (!token) {
  location.href = "user-login.html";
}
</script>

<script>
/* ======================
   LOAD USER BALANCE
   ====================== */
function loadUserBalance() {
  fetch(API + "/user/me", {
    headers: {
      Authorization: "Bearer " + token
    }
  })
  .then(res => {
    if (!res.ok) {
      location.href = "user-login.html";
      return;
    }
    return res.json();
  })
  .then(user => {
    if (!user) return;
    document.getElementById("userBalance").innerText = user.balance;
  });
}

loadUserBalance();
</script>

<script>
/* ======================
   AKHAR GRID + PREVIEW
   ====================== */
const grid = document.getElementById("numberGrid");
const betList = document.getElementById("betList");
const totalAmountEl = document.getElementById("totalAmount");

const betsMap = {}; // { digit: amount }

// CREATE 0–9 GRID
for (let i = 0; i <= 9; i++) {
  const box = document.createElement("div");
  box.className = "box";
  box.innerHTML = `
    <b>${i}</b>
    <input
      type="number"
      class="digit-input"
      data-digit="${i}"
      placeholder="₹"
      min="0"
      oninput="updateBet('${i}', this.value)"
    >
  `;
  grid.appendChild(box);
}

function updateBet(digit, value) {
  const amt = Number(value);

  if (amt > 0) {
    betsMap[digit] = amt;
  } else {
    delete betsMap[digit];
  }

  renderPreview();
}

function renderPreview() {
  betList.innerHTML = "";
  let total = 0;

  Object.keys(betsMap).forEach(digit => {
    const amt = betsMap[digit];
    total += amt;

    betList.innerHTML += `
      <p>${digit} → ₹ ${amt}</p>
    `;
  });

  totalAmountEl.innerText = total;
}
</script>

<script>
/* ======================
   SUBMIT BET
   ====================== */
function submitBet() {
  const bets = [];
  let total = 0;

  document.querySelectorAll(".digit-input").forEach(input => {
    const amount = Number(input.value);
    const digit = input.dataset.digit;

    if (amount > 0) {
      bets.push({ digit, amount });
      total += amount;
    }
  });

  if (!bets.length) {
    alert("Place at least one bet");
    return;
  }

  fetch(API + "/user/place-bet", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      Authorization: "Bearer " + token
    },
    body: JSON.stringify({
      bets,
      totalAmount: total
    })
  })
  .then(res => res.json())
  .then(data => {
    if (!data.success) {
      alert(data.error || "Bet failed");
      return;
    }

    // UPDATE BALANCE
    document.getElementById("userBalance").innerText = data.newBalance;

    // RESET
    document.querySelectorAll(".digit-input").forEach(i => i.value = "");
    betList.innerHTML = "";
    totalAmountEl.innerText = "0";

    alert("Bet placed successfully 🎉");
  })
  .catch(() => {
    alert("Server error");
  });
}
</script>

</body>
</html>
