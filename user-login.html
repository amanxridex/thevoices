<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SUPER D • User Login</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>

<div class="login-wrapper">
  <div class="login-box">

    <div class="brand">
      SUPER <span>D</span>
    </div>

    <h2>Welcome Back</h2>
    <p class="subtitle">Login to continue playing</p>

    <input id="username" placeholder="Username / Mobile">
    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">Login</button>

    <p id="error"></p>

    <div class="footer-text">
      Powered by <b>SUPER D</b>
    </div>

  </div>
</div>

<script>
const API = "https://matka-backend-4fy1.onrender.com";

function login() {
  const errorEl = document.getElementById("error");
  errorEl.innerText = "";

  fetch(API + "/user/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      username: document.getElementById("username").value.trim(),
      password: document.getElementById("password").value
    })
  })
  .then(async res => {
    // 🔐 SAFETY FIX: handle non-JSON / 404 / HTML responses
    if (!res.ok) {
      const text = await res.text();
      throw new Error("Login failed");
    }
    return res.json();
  })
  .then(data => {
    if (!data || !data.token) {
      errorEl.innerText = data?.error || "Invalid username or password";
      return;
    }

    localStorage.setItem("userToken", data.token);
    localStorage.setItem("userId", data.user._id);
    localStorage.setItem("username", data.user.username);

    location.href = "index.html";
  })
  .catch(() => {
    errorEl.innerText = "Server error. Please try again.";
  });
}
</script>

</body>
</html>
