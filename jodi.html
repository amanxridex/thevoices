<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JODI • SUPER D</title>
  <link rel="stylesheet" href="jodi.css">
</head>
<body>

<header class="top">
  <h1>SUPER <span>D</span></h1>
</header>

<!-- TOGGLE -->
<div class="toggle">
  <button onclick="goToAkhar()">AKHAR</button>
  <button class="active">JODI</button>
</div>

<h2 class="subtitle">Select Jodi & Enter Amount</h2>

<!-- USER BALANCE -->
<div class="user-balance-box">
  Available Balance: ₹ <span id="userBalance">0</span>
</div>

<!-- JODI GRID -->
<div class="grid" id="jodiGrid"></div>

<!-- PREVIEW -->
<div class="preview">
  <h3>Bet Preview</h3>
  <div id="betList"></div>
  <hr>
  <p class="total">Total: ₹ <span id="totalAmount">0</span></p>
</div>

<button class="submit-btn" onclick="submitBet()">SUBMIT BET</button>

<!-- ======================
     GLOBAL CONFIG
     ====================== -->
<script>
const API = "https://matka-backend-4fy1.onrender.com";
const token = localStorage.getItem("userToken");

if (!token) {
  location.href = "user-login.html";
}

// ✅ GET MARKET FROM URL
const params = new URLSearchParams(window.location.search);
const market = params.get("market");

if (!market) {
  alert("Market not selected");
  location.href = "index.html";
}
</script>

<!-- ======================
     LOAD USER BALANCE
     ====================== -->
<script>
function loadUserBalance() {
  fetch(API + "/user/me", {
    headers: { Authorization: "Bearer " + token }
  })
  .then(res => res.json())
  .then(user => {
    document.getElementById("userBalance").innerText = user.balance;
  });
}
loadUserBalance();
</script>

<!-- ======================
     JODI GRID + PREVIEW
     ====================== -->
<script>
const grid = document.getElementById("jodiGrid");
const betList = document.getElementById("betList");
const totalAmountEl = document.getElementById("totalAmount");

// TOGGLE
function goToAkhar() {
  location.href = `akhar.html?market=${encodeURIComponent(market)}`;
}

// BET STORAGE
const betsMap = {};

// CREATE 00–99 GRID
for (let i = 0; i <= 99; i++) {
  const num = i.toString().padStart(2, "0");

  const box = document.createElement("div");
  box.className = "box";
  box.innerHTML = `
    <b>${num}</b>
    <input
      type="number"
      class="digit-input"
      data-digit="${num}"
      placeholder="₹"
      min="0"
      oninput="updateBet('${num}', this.value)"
    >
  `;
  grid.appendChild(box);
}

function updateBet(jodi, value) {
  const amt = Number(value);
  if (amt > 0) betsMap[jodi] = amt;
  else delete betsMap[jodi];
  renderPreview();
}

function renderPreview() {
  betList.innerHTML = "";
  let total = 0;

  Object.keys(betsMap).forEach(jodi => {
    const amt = betsMap[jodi];
    total += amt;
    betList.innerHTML += `<p>${jodi} → ₹ ${amt}</p>`;
  });

  totalAmountEl.innerText = total;
}
</script>

<!-- ======================
     SUBMIT BET
     ====================== -->
<script>
function submitBet() {
  const bets = [];
  let total = 0;

  document.querySelectorAll(".digit-input").forEach(input => {
    const amount = Number(input.value);
    const digit = input.dataset.digit;

    if (amount > 0) {
      bets.push({ digit, amount });
      total += amount;
    }
  });

  if (!bets.length) {
    alert("Place at least one bet");
    return;
  }

  fetch(API + "/user/place-bet", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      Authorization: "Bearer " + token
    },
    body: JSON.stringify({
      market,
      gameType: "JODI",
      bets,
      totalAmount: total
    })
  })
  .then(res => res.json())
  .then(data => {
    if (!data.success) {
      alert(data.error || "Bet failed");
      return;
    }

    document.getElementById("userBalance").innerText = data.newBalance;
    document.querySelectorAll(".digit-input").forEach(i => i.value = "");
    betList.innerHTML = "";
    totalAmountEl.innerText = "0";

    alert("Bet placed successfully 🎉");
  })
  .catch(() => alert("Server error"));
}
</script>

</body>
</html>
