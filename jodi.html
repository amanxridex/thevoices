<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JODI • SUPER D</title>
  <link rel="stylesheet" href="jodi.css">
</head>
<body>

<header class="top">
  <h1>SUPER <span>D</span></h1>
</header>

<!-- TOGGLE -->
<div class="toggle">
  <button onclick="location.href='akhar.html'">AKHAR</button>
  <button class="active">JODI</button>
</div>

<h2 class="subtitle">Select Jodi & Enter Amount</h2>

<!-- USER BALANCE -->
<div class="user-balance-box">
  Available Balance: ₹ <span id="userBalance">0</span>
</div>

<!-- JODI GRID -->
<div class="grid" id="jodiGrid"></div>

<!-- PREVIEW -->
<div class="preview">
  <h3>Bet Preview</h3>
  <div id="betList"></div>
  <hr>
  <p class="total">Total: ₹ <span id="totalAmount">0</span></p>
</div>

<button class="submit-btn" onclick="submitBet()">SUBMIT BET</button>

<script>
const API = "https://matka-backend-4fy1.onrender.com";
const token = localStorage.getItem("userToken");

if (!token) {
  location.href = "user-login.html";
}
</script>

<script>
/* ======================
   LOAD USER BALANCE
   ====================== */
function loadUserBalance() {
  fetch(API + "/user/me", {
    headers: {
      Authorization: "Bearer " + token
    }
  })
  .then(res => {
    if (!res.ok) {
      location.href = "user-login.html";
      return;
    }
    return res.json();
  })
  .then(user => {
    if (!user) return;
    document.getElementById("userBalance").innerText = user.balance;
  });
}

loadUserBalance();
</script>

<script>
/* ======================
   JODI GRID + PREVIEW
   ====================== */
const grid = document.getElementById("jodiGrid");
const betList = document.getElementById("betList");
const totalAmountEl = document.getElementById("totalAmount");
const params = new URLSearchParams(window.location.search);
const marketName = params.get("market");

if (!marketName) {
  alert("Market not selected");
  location.href = "index.html";
}

const betsMap = {}; // { "02": 100, "15": 50 }

// CREATE 00–99 GRID
for (let i = 0; i <= 99; i++) {
  const num = i.toString().padStart(2, "0");

  const box = document.createElement("div");
  box.className = "box";
  box.innerHTML = `
    <b>${num}</b>
    <input
      type="number"
      class="digit-input"
      data-digit="${num}"
      placeholder="₹"
      min="0"
      oninput="updateBet('${num}', this.value)"
    >
  `;
  grid.appendChild(box);
}

function updateBet(jodi, value) {
  const amt = Number(value);

  if (amt > 0) {
    betsMap[jodi] = amt;
  } else {
    delete betsMap[jodi];
  }

  renderPreview();
}

function renderPreview() {
  betList.innerHTML = "";
  let total = 0;

  Object.keys(betsMap).forEach(jodi => {
    const amt = betsMap[jodi];
    total += amt;

    betList.innerHTML += `
      <p>${jodi} → ₹ ${amt}</p>
    `;
  });

  totalAmountEl.innerText = total;
}
</script>

<script>
/* ======================
   SUBMIT BET
   ====================== */
function submitBet() {
  const bets = [];
  let total = 0;

  document.querySelectorAll(".digit-input").forEach(input => {
    const amount = Number(input.value);
    const digit = input.dataset.digit;

    if (amount > 0) {
      bets.push({ digit, amount });
      total += amount;
    }
  });

  if (!bets.length) {
    alert("Place at least one bet");
    return;
  }

  fetch(API + "/user/place-bet", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      Authorization: "Bearer " + token
    },
    body: JSON.stringify({
      bets,
      totalAmount: total
    })
  })
  .then(res => res.json())
  .then(data => {
    if (!data.success) {
      alert(data.error || "Bet failed");
      return;
    }

    // UPDATE BALANCE
    document.getElementById("userBalance").innerText = data.newBalance;

    // RESET UI
    document.querySelectorAll(".digit-input").forEach(i => i.value = "");
    betList.innerHTML = "";
    totalAmountEl.innerText = "0";

    alert("Bet placed successfully 🎉");
  })
  .catch(() => {
    alert("Server error");
  });
}
</script>

</body>
</html>
