<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SUPER D • Results Control</title>
  <link rel="stylesheet" href="results.css">
</head>
<body>

<!-- TOP BAR -->
<header class="topbar">
  <div class="logo">SUPER <span>D</span></div>
  <button class="logout">Logout</button>
</header>

<div class="page">

  <h1 class="title">🏆 Results Control Room</h1>
  <p class="subtitle">One number decides everything</p>

  <!-- RESULT PANEL -->
  <div class="result-panel">

    <div class="panel-left">
      <label>Market</label>
      <select>
        <option>MADHUR MORNING</option>
        <option>MADHUR NIGHT</option>
        <option>KALYAN NIGHT</option>
        <option>SRIDEVI MORNING</option>
      </select>

      <label>Result Number</label>
      <input type="text" placeholder="Ex: 123-45-678">

      <label>Session</label>
      <div class="session">
        <button class="session-btn active">OPEN</button>
        <button class="session-btn">CLOSE</button>
      </div>

      <button class="publish">🔥 PUBLISH RESULT</button>
    </div>

    <!-- LIVE PREVIEW -->
    <div class="panel-right">
      <div class="preview-title">LIVE RESULT PREVIEW</div>

      <div class="preview-card">
        <div class="market-name">MADHUR MORNING</div>
        <div class="result-number">123-45-678</div>
        <div class="session-tag">OPEN SESSION</div>
      </div>

      <div class="warning">
        ⚠️ Once published, result cannot be undone
      </div>
    </div>

  </div>

</div>

</body>
</html>
