<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SUPER D • Results Control</title>
  <link rel="stylesheet" href="results.css">
</head>
<body>

<header class="topbar">
  <div class="logo">SUPER <span>D</span></div>
  <button class="logout" onclick="logout()">Logout</button>
</header>

<div class="page">

  <h1 class="title">🏆 Results Control Room</h1>
  <p class="subtitle">One number decides everything</p>

  <!-- RESULT PANEL -->
  <div class="result-panel">

    <!-- LEFT -->
    <div class="panel-left">
      <label>Market</label>
      <select id="marketSelect"></select>

      <label>Result Number</label>
      <input type="text" id="resultInput" placeholder="Ex: 123-45-678">

      <button class="publish" onclick="publishResult()">🔥 PUBLISH RESULT</button>
    </div>

    <!-- RIGHT -->
    <div class="panel-right">
      <div class="preview-title">LIVE RESULT PREVIEW</div>

      <div class="preview-card">
        <div class="market-name" id="previewMarket">—</div>
        <div class="result-number" id="previewResult">---</div>
      </div>

      <div class="warning">
        ⚠️ Once published, result cannot be undone
      </div>
    </div>

  </div>

  <!-- RESULTS TABLE -->
  <h2 style="margin-top:40px">📋 All Market Results</h2>

  <table class="results-table">
    <thead>
      <tr>
        <th>Market</th>
        <th>Result</th>
        <th>Date</th>
      </tr>
    </thead>
    <tbody id="resultsTable"></tbody>
  </table>

</div>

<script>
const API = "https://matka-backend-4fy1.onrender.com";

/* LOGOUT */
function logout() {
  localStorage.clear();
  location.href = "superadmin-login.html";
}

/* LOAD MARKETS (ALL FROM DB) */
fetch(API + "/api/markets")
  .then(res => res.json())
  .then(markets => {
    const select = document.getElementById("marketSelect");
    select.innerHTML = "";

    markets.forEach(m => {
      const opt = document.createElement("option");
      opt.value = m.name;
      opt.textContent = m.name;
      select.appendChild(opt);
    });

    updatePreview();
  });

/* LIVE PREVIEW */
function updatePreview() {
  document.getElementById("previewMarket").innerText =
    marketSelect.value || "—";

  document.getElementById("previewResult").innerText =
    resultInput.value || "---";
}

marketSelect.onchange = updatePreview;
resultInput.oninput = updatePreview;

/* PUBLISH RESULT */
function publishResult() {
  const market = marketSelect.value;
  const result = resultInput.value.trim();

  if (!market || !result) {
    return alert("Market aur result dono bharo");
  }

  fetch(API + "/api/results/publish", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ market, result })
  })
  .then(res => res.json())
  .then(data => {
    if (data.error) {
      alert(data.error);
      return;
    }

    resultInput.value = "";
    loadResults();
    updatePreview();
  });
}

/* LOAD RESULTS TABLE (ALL MARKETS + BLANK RESULT) */
function loadResults() {
  Promise.all([
    fetch(API + "/api/markets").then(res => res.json()),
    fetch(API + "/api/results").then(res => res.json())
  ])
  .then(([markets, results]) => {
    const tbody = document.getElementById("resultsTable");
    tbody.innerHTML = "";

    markets.forEach(market => {
      const r = results.find(x => x.market === market.name);

      tbody.innerHTML += `
        <tr>
          <td>${market.name}</td>
          <td>${r ? r.result : "-"}</td>
          <td>${r ? new Date(r.date).toLocaleString() : "-"}</td>
        </tr>
      `;
    });
  });
}

loadResults();
</script>

</body>
</html>
