<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SUPER D • Results Control</title>
  <link rel="stylesheet" href="results.css">
</head>
<body>

<header class="topbar">
  <div class="logo">SUPER <span>D</span></div>
  <button class="logout" onclick="logout()">Logout</button>
</header>

<div class="page">

  <h1 class="title">🏆 Results Control Room</h1>
  <p class="subtitle">One number decides everything</p>

  <!-- RESULT PANEL -->
  <div class="result-panel">

    <!-- LEFT -->
    <div class="panel-left">
      <label>Market</label>
      <select id="marketSelect"></select>

      <label>Result Number</label>
      <input type="text" id="resultInput" placeholder="Ex: 52">

      <button class="publish" onclick="publishResult()">🔥 PUBLISH RESULT</button>
    </div>

    <!-- RIGHT -->
    <div class="panel-right">
      <div class="preview-title">LIVE RESULT PREVIEW</div>

      <div class="preview-card">
        <div class="market-name" id="previewMarket">—</div>
        <div class="result-number" id="previewResult">---</div>
      </div>

      <div class="warning">
        ⚠️ Once published, result cannot be undone
      </div>
    </div>

  </div>

  <!-- RESULTS TABLE -->
  <h2 style="margin-top:40px">📋 All Market Results</h2>

  <!-- DATE FILTER -->
  <div class="result-filter">
    <label>📅 Select Date</label>

    <div class="date-box" id="dateBox">
      <span id="dateText">--/--/----</span>
      <span class="calendar-icon">📆</span>
      <input type="date" id="resultDate">
    </div>
  </div>

  <table class="results-table">
    <thead>
      <tr>
        <th>Market</th>
        <th>Result</th>
        <th>Date</th>
      </tr>
    </thead>
    <tbody id="resultsTable"></tbody>
  </table>

</div>

<script>
const API = "https://matka-backend-4fy1.onrender.com";

/* LOGOUT */
function logout() {
  localStorage.clear();
  location.href = "superadmin-login.html";
}

/* DOM ELEMENTS */
const marketSelect = document.getElementById("marketSelect");
const resultInput  = document.getElementById("resultInput");
const previewMarket = document.getElementById("previewMarket");
const previewResult = document.getElementById("previewResult");
const resultDate = document.getElementById("resultDate");
const dateText = document.getElementById("dateText");
const dateBox = document.getElementById("dateBox");

/* LOAD MARKETS */
fetch(API + "/api/markets")
  .then(res => res.json())
  .then(markets => {
    marketSelect.innerHTML = "";
    markets.forEach(m => {
      const opt = document.createElement("option");
      opt.value = m.name;
      opt.textContent = m.name;
      marketSelect.appendChild(opt);
    });
    updatePreview();
  });

/* LIVE PREVIEW */
function updatePreview() {
  previewMarket.innerText = marketSelect.value || "—";
  previewResult.innerText = resultInput.value || "---";
}

marketSelect.addEventListener("change", updatePreview);
resultInput.addEventListener("input", updatePreview);

/* PUBLISH RESULT */
function publishResult() {
  const market = marketSelect.value;
  const result = resultInput.value.trim();

  if (!market || !result) {
    alert("Market aur result dono bharo");
    return;
  }

  fetch(API + "/api/results/publish", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ market, result })
  })
  .then(res => res.json())
  .then(data => {
    if (data.error) {
      alert(data.error);
      return;
    }

    resultInput.value = "";
    updatePreview();
    loadResultsByDate(resultDate.value);
  });
}

/* LOAD RESULTS DATE-WISE */
function loadResultsByDate(selectedDate) {
  Promise.all([
    fetch(API + "/api/markets").then(res => res.json()),
    fetch(API + "/api/results").then(res => res.json())
  ])
  .then(([markets, results]) => {
    const tbody = document.getElementById("resultsTable");
    tbody.innerHTML = "";

    markets.forEach(market => {
      const r = results.find(x => {
        const d = new Date(x.date).toISOString().split("T")[0];
        return x.market === market.name && d === selectedDate;
      });

      tbody.innerHTML += `
        <tr>
          <td>${market.name}</td>
          <td>${r ? r.result : "--"}</td>
          <td>${r ? new Date(r.date).toLocaleString() : "--"}</td>
        </tr>
      `;
    });
  });
}

/* DATE FORMATTER */
function updateDateText(dateStr) {
  const d = new Date(dateStr);
  const formatted =
    String(d.getDate()).padStart(2, "0") + "/" +
    String(d.getMonth() + 1).padStart(2, "0") + "/" +
    d.getFullYear();
  dateText.innerText = formatted;
}

/* DATE PICKER DEFAULT = TODAY */
const today = new Date().toISOString().split("T")[0];
resultDate.value = today;
updateDateText(today);
loadResultsByDate(today);

/* CLICK DATE BOX → OPEN CALENDAR */
dateBox.addEventListener("click", () => {
  if (resultDate.showPicker) {
    resultDate.showPicker();
  } else {
    resultDate.click();
  }
});

/* ON DATE CHANGE */
resultDate.addEventListener("change", () => {
  updateDateText(resultDate.value);
  loadResultsByDate(resultDate.value);
});
</script>

</body>
</html>
