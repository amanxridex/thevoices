<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SUPER D • Sub Admin Control</title>
  <link rel="stylesheet" href="subadmins.css">
</head>
<body>

<header class="topbar">
  <div class="brand">SUPER <span>D</span></div>
  <button class="back-btn" onclick="goBack()">⬅ Dashboard</button>
</header>

<div class="page">

  <h1 class="title">👑 Sub Admin Control</h1>
  <p class="subtitle">Create & monitor sub admin power</p>

  <!-- STATS -->
  <div class="stats-grid">
    <div class="stat-card">
      <span>Total Sub Admins</span>
      <h2 id="totalSubs">0</h2>
    </div>
    <div class="stat-card">
      <span>Total Users</span>
      <h2 id="totalUsers">0</h2>
    </div>
    <div class="stat-card">
      <span>Total Wallet</span>
      <h2 id="totalWallet">₹ 0</h2>
    </div>
  </div>

  <!-- CREATE -->
  <div class="card create-card">
    <h2>Create Sub Admin</h2>
    <input id="saUser" placeholder="Username">
    <input id="saPass" type="password" placeholder="Password">
    <button onclick="createSubAdmin()">Create Sub Admin</button>
  </div>

  <!-- LIST -->
  <div class="card list-card">
    <h2>Sub Admin List</h2>

    <div class="subadmin-header">
      <span>Sub Admin</span>
      <span>Total Users</span>
      <span>Total Wallet</span>
      <span>Actions</span>
    </div>

    <div id="subAdminList"></div>
  </div>

</div>

<script>
const API = "https://matka-backend-4fy1.onrender.com";

function goBack() {
  location.href = "dashboard.html";
}

function loadSubAdmins() {
  fetch(API + "/admin/subadmins", {
    headers: {
      Authorization: "Bearer " + localStorage.getItem("adminToken")
    }
  })
  .then(res => {
    if (!res.ok) throw new Error("Unauthorized");
    return res.json();
  })
  .then(data => {
    const list = document.getElementById("subAdminList");
    list.innerHTML = "";

    let totalUsers = 0;
    let totalWallet = 0;

    document.getElementById("totalSubs").innerText = data.length;

    data.forEach(sa => {
      totalUsers += sa.users || 0;
      totalWallet += sa.balance || 0;

      const row = document.createElement("div");
      row.className = "subadmin-row";
      row.innerHTML = `
        <div><strong>${sa.username}</strong></div>
        <div>${sa.users || 0}</div>
        <div>₹ ${sa.balance || 0}</div>
        <div><button class="action-btn">View</button></div>
      `;
      list.appendChild(row);
    });

    document.getElementById("totalUsers").innerText = totalUsers;
    document.getElementById("totalWallet").innerText = "₹ " + totalWallet;
  })
  .catch(err => {
    console.error(err);
    alert("Session expired. Please login again.");
    location.href = "login.html";
  });
}

loadSubAdmins();
</script>

<script src="admin.js"></script>
</body>
</html>
