<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SUPER D • Sub Admin Control</title>
  <link rel="stylesheet" href="subadmins.css">
</head>
<body>

<!-- TOP BAR -->
<header class="topbar">
  <div class="logo">SUPER <span>D</span></div>
  <button class="back-btn" onclick="location.href='dashboard.html'">← Dashboard</button>
</header>

<div class="page">

  <!-- TITLE -->
  <h1 class="title">👑 Sub Admin Control</h1>
  <p class="subtitle">Monitor power, users & money flow</p>

  <!-- 🔥 CREATE SUB ADMIN -->
  <div class="create-box">
    <h2>Create New Sub Admin</h2>

    <div class="form-row">
      <input type="text" placeholder="Username">
      <input type="password" placeholder="Password">
      <button>Create Sub Admin</button>
    </div>
  </div>

  <!-- STATS -->
  <div class="stats-grid">
    <div class="stat-card">
      <p>Total Sub Admins</p>
      <h3>2</h3>
    </div>

    <div class="stat-card">
      <p>Total Users</p>
      <h3>346</h3>
    </div>

    <div class="stat-card">
      <p>Total Wallet Amount</p>
      <h3>₹ 4,85,000</h3>
    </div>
  </div>

  <!-- SUB ADMIN LIST -->
  <div class="subadmin-grid">

    <div class="sub-card">
      <h3>ramesh</h3>
      <p>👥 Users: <b>180</b></p>
      <p>💰 Wallet: <b>₹ 2,75,000</b></p>
      <button>View Details</button>
    </div>

    <div class="sub-card">
      <h3>shampy</h3>
      <p>👥 Users: <b>166</b></p>
      <p>💰 Wallet: <b>₹ 2,10,000</b></p>
      <button>View Details</button>
    </div>

  </div>

</div>

</body>
</html>
