<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SUPER D • Sub Admin Panel</title>
  <link rel="stylesheet" href="subadmin-dashboard.css">
</head>
<body>

<header class="topbar">
  <div class="logo">SUPER <span>D</span></div>
  <div class="right">
    <span class="admin-name">
      👤 Sub Admin: <span id="subAdminName"></span>
    </span>
    <button class="logout">Logout</button>
  </div>
</header>

<div class="page">

  <h1 class="title">📊 Sub Admin Dashboard</h1>

  <!-- STATS -->
  <div class="stats-grid">
    <div class="stat-card">
      <span>Total Users</span>
      <h2 id="totalUsers">0</h2>
    </div>
    <div class="stat-card">
      <span>Your Wallet</span>
      <h2 id="myWallet">0</h2>
    </div>
    <div class="stat-card">
      <span>Users Total Wallet</span>
      <h2 id="totalWallet">₹ 0</h2>
    </div>
  </div>

  <div class="main-grid">

    <!-- CREATE USER -->
    <div class="card create-card">
      <h2>Create User</h2>
      <input type="text" id="newUser" placeholder="Username">
      <input type="password" id="newPass" placeholder="Password">
      <button onclick="createUser()">Create User</button>
    </div>

    <!-- USER LIST -->
    <div class="card list-card">
      <h2>User List</h2>
      <table>
        <thead>
          <tr>
            <th>User</th>
            <th>Balance</th>
            <th>Actions</th>
            <th>Suspend</th>
          </tr>
        </thead>
        <tbody id="userTable"></tbody>
      </table>
    </div>

  </div>

</div>

<script>
const API = "https://matka-backend-4fy1.onrender.com";
const token = localStorage.getItem("subToken");
const name = localStorage.getItem("subUsername");

if (!token) location.href = "subadmin-login.html";
document.getElementById("subAdminName").innerText = name;

function loadMyWallet() {
  fetch(API + "/subadmin/me", {
    headers: {
      Authorization: "Bearer " + token
    }
  })
  .then(res => res.json())
  .then(data => {
    document.getElementById("myWallet").innerText =
      "₹ " + (data.balance || 0);
  });
}

/* LOGOUT */
document.querySelector(".logout").onclick = () => {
  localStorage.clear();
  location.href = "subadmin-login.html";
};

let activeUserId = null;

/* LOAD USERS */
function loadUsers() {
  fetch(API + "/subadmin/users", {
    headers: { Authorization: "Bearer " + token }
  })
  .then(res => res.json())
  .then(users => {
    const tbody = document.getElementById("userTable");
    tbody.innerHTML = "";

    let totalWallet = 0;

    users.forEach(u => {
      totalWallet += u.balance;

      tbody.innerHTML += `
        <tr>
          <td>${u.username}</td>
          <td id="balance-${u._id}">₹ ${u.balance}</td>
          <td>
            <button class="view-btn"
              onclick="openWallet('${u._id}', '${u.username}', ${u.balance})">
              View
            </button>
          </td>
          <td>
            <button class="suspend-btn"
              onclick="confirmSuspend('${u._id}', '${u.username}', ${u.balance})">
              Suspend
            </button>
          </td>
        </tr>
      `;
    });

    document.getElementById("totalUsers").innerText = users.length;
    document.getElementById("totalWallet").innerText = "₹ " + totalWallet;
  });
}

/* CREATE USER */
function createUser() {
  fetch(API + "/subadmin/users/create", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      Authorization: "Bearer " + token
    },
    body: JSON.stringify({
      username: newUser.value,
      password: newPass.value
    })
  })
  .then(() => {
    newUser.value = "";
    newPass.value = "";
    loadUsers();
  });
}

/* WALLET MODAL */
function openWallet(id, username, balance) {
  activeUserId = id;

  document.getElementById("modalUser").innerText =
    "Wallet • " + username;

  document.getElementById("modalBalance").innerText = balance;
  document.getElementById("walletModal").style.display = "flex";

  loadTransactions(id);
}

/* ADD / DEDUCT */
function updateWallet(type) {
  const amount = Number(amountInput.value);
  if (!amount) return alert("Enter amount");

  fetch(API + "/subadmin/users/wallet/" + activeUserId, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      Authorization: "Bearer " + token
    },
    body: JSON.stringify({ amount, type })
  })
  .then(res => res.json())
  .then(data => {
    if (!data.success) {
      alert(data.error || "Wallet update failed");
      return;
    }

    // ✅ MODAL BALANCE (SAFE)
    document.getElementById("modalBalance").innerText =
      data.userBalance;

    // ✅ REFRESH TABLE + STATS
    loadUsers();

    // ✅ REFRESH SUBADMIN WALLET
    loadMyWallet();

    amountInput.value = "";
  })
  .catch(err => {
    console.error(err);
    alert("Server error");
  });
}


function addBalance() { updateWallet("ADD"); }
function deductBalance() { updateWallet("DEDUCT"); }

/* TRANSACTIONS */
function loadTransactions(id) {
  fetch(API + "/subadmin/users", {
    headers: { Authorization: "Bearer " + token }
  })
  .then(res => res.json())
  .then(users => {
    const user = users.find(u => u._id === id);
    const ul = document.getElementById("txnList");
    ul.innerHTML = "";

    if (!user || !user.transactions) return;

    user.transactions.forEach(t => {
      const sign = t.type === "ADD" ? "+" : "-";
      const cls = t.type === "ADD" ? "plus" : "minus";

      ul.innerHTML += `
        <li class="${cls}">
          <span>${sign}${t.amount}</span>
          <span>${new Date(t.date).toLocaleString()}</span>
          <span class="txn-type">${t.type}</span>
        </li>
     `;
   });

  });
}

function confirmSuspend(userId, username) {
  const ok = confirm(
    `⚠️ Are you sure?\n\nDo you want to permanently delete user "${username}"?\n\nThis action cannot be undone.`
  );

  if (!ok) return;

  deleteUser(userId);
}

function deleteUser(userId) {
  fetch(API + "/subadmin/users/" + userId, {
    method: "DELETE",
    headers: {
      Authorization: "Bearer " + token
    }
  })
  .then(res => res.json())
  .then(data => {
    if (!data.success) {
      alert(data.error || "Delete failed");
      return;
    }

    alert("✅ User suspended successfully");

    // refresh everything
    loadUsers();
    loadMyWallet();
  })
  .catch(() => {
    alert("Server error while deleting user");
  });
}


function closeModal() {
  document.getElementById("walletModal").style.display = "none";
}

loadUsers();
loadMyWallet();
</script>

<!-- WALLET MODAL -->
<div id="walletModal" class="modal">
  <div class="modal-box">

    <div class="modal-header">
      <h3 id="modalUser">Wallet</h3>
      <button class="close-btn" onclick="closeModal()">✖</button>
    </div>

    <div class="modal-balance">
      Balance: ₹ <span id="modalBalance">0</span>
    </div>

    <input
      type="number"
      id="amountInput"
      placeholder="Enter amount"
    />

    <div class="modal-actions">
      <button class="add-btn" onclick="addBalance()">➕ Add</button>
      <button class="deduct-btn" onclick="deductBalance()">➖ Deduct</button>
    </div>
  
    <h4>Transaction History</h4>

    <div class="txn-head">
      <span>Amount</span>
      <span>Date & Time</span>
      <span>Type</span>
    </div>

    <ul id="txnList" class="txn-list"></ul>


  </div>
</div>

</body>
</html>
