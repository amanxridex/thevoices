<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SUPER D • Sub Admin Panel</title>
  <link rel="stylesheet" href="subadmin-dashboard.css">
</head>
<body>

<header class="topbar">
  <div class="logo">SUPER <span>D</span></div>
  <div class="right">
    <span class="admin-name">
      👤 Sub Admin: <span id="subAdminName"></span>
    </span>
    <button class="logout">Logout</button>
  </div>
</header>

<div class="page">

  <h1 class="title">📊 Sub Admin Dashboard</h1>

  <!-- STATS -->
  <div class="stats-grid">
    <div class="stat-card">
      <span>Total Users</span>
      <h2 id="totalUsers">0</h2>
    </div>
    <div class="stat-card">
      <span>Total Wallet</span>
      <h2 id="totalWallet">₹ 0</h2>
    </div>
  </div>

  <div class="main-grid">

    <!-- CREATE USER -->
    <div class="card create-card">
      <h2>Create User</h2>
      <input type="text" id="newUser" placeholder="Username">
      <input type="password" id="newPass" placeholder="Password">
      <button onclick="createUser()">Create User</button>
    </div>

    <!-- USER LIST -->
    <div class="card list-card">
      <h2>User List</h2>
      <table>
        <thead>
          <tr>
            <th>User</th>
            <th>Balance</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="userTable"></tbody>
      </table>
    </div>

  </div>

</div>

<script>
const API = "https://matka-backend-4fy1.onrender.com";
const token = localStorage.getItem("subToken");
const name = localStorage.getItem("subUsername");

if (!token) location.href = "subadmin-login.html";
document.getElementById("subAdminName").innerText = name;

/* LOGOUT */
document.querySelector(".logout").onclick = () => {
  localStorage.clear();
  location.href = "subadmin-login.html";
};

/* LOAD USERS */
function loadUsers() {
  fetch(API + "/subadmin/users", {
    headers: { Authorization: "Bearer " + token }
  })
  .then(res => res.json())
  .then(users => {
    const tbody = document.getElementById("userTable");
    tbody.innerHTML = "";

    let totalWallet = 0;

    users.forEach(u => {
      totalWallet += u.balance;

      tbody.innerHTML += `
        <tr>
          <td>${u.username}</td>
          <td>₹ ${u.balance}</td>
          <td>
            <button class ="view-btn" onclick="openWallet('${u.username}', ${u.balance})"
              View
            </button>
          </td>
        </tr>
      `;
    });

    document.getElementById("totalUsers").innerText = users.length;
    document.getElementById("totalWallet").innerText = "₹ " + totalWallet;
  });
}

/* CREATE USER */
function createUser() {
  fetch(API + "/subadmin/users/create", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      Authorization: "Bearer " + token
    },
    body: JSON.stringify({
      username: newUser.value,
      password: newPass.value
    })
  })
  .then(res => res.json())
  .then(() => {
    newUser.value = "";
    newPass.value = "";
    loadUsers(); // 🔥 refresh data
  });
}

loadUsers();
</script>

<div id="walletModal" class="modal">
  <div class="modal-box">

    <h2 id="modalUser">User Wallet</h2>
    <h3>Total Balance: ₹ <span id="modalBalance">0</span></h3>

    <div class="wallet-actions">
      <input type="number" id="amountInput" placeholder="Enter amount">

      <div class="btn-row">
        <button class="add-btn" onclick="addBalance()">+ Add</button>
        <button class="deduct-btn" onclick="deductBalance()">- Deduct</button>
      </div>
    </div>

    <h4>Transaction History</h4>
    <ul id="txnList"></ul>

    <button class="close-btn" onclick="closeModal()">Close</button>

  </div>
</div>

<script>
let currentUser = "";
let currentBalance = 0;
let transactions = [];

function openWallet(username, balance) {
  currentUser = username;
  currentBalance = balance;
  transactions = [];

  document.getElementById("modalUser").innerText =
    "Wallet • " + username;

  document.getElementById("modalBalance").innerText =
    currentBalance;

  document.getElementById("txnList").innerHTML = "";

  document.getElementById("walletModal").style.display = "flex";
}

function addBalance() {
  const amt = Number(amountInput.value);
  if (!amt) return alert("Enter amount");

  currentBalance += amt;
  transactions.unshift("+" + amt);

  refreshWallet();
}

function deductBalance() {
  const amt = Number(amountInput.value);
  if (!amt) return alert("Enter amount");

  currentBalance -= amt;
  transactions.unshift("-" + amt);

  refreshWallet();
}

function refreshWallet() {
  document.getElementById("modalBalance").innerText =
    currentBalance;

  const ul = document.getElementById("txnList");
  ul.innerHTML = "";

  transactions.forEach(t => {
    const li = document.createElement("li");
    li.innerText = t;
    li.className = t.startsWith("+") ? "plus" : "minus";
    ul.appendChild(li);
  });

  amountInput.value = "";
}

function closeModal() {
  document.getElementById("walletModal").style.display = "none";
}
</script>

</body>
</html>
