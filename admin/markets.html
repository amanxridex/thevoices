<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SUPER D • Markets Control</title>
  <link rel="stylesheet" href="markets.css">
</head>
<body>

<!-- TOP BAR -->
<header class="topbar">
  <div class="logo">SUPER <span>D</span></div>
  <button class="logout">Logout</button>
</header>

<!-- PAGE -->
<div class="page">

  <h1 class="title">🎯 Market Control Room</h1>
  <p class="subtitle">Open, close & dominate the game</p>

  <!-- MARKET GRID -->
  <div class="market-grid">

    <!-- MARKET CARD -->
    <div class="market-card closed">
      <div class="market-name">MADHUR MORNING</div>
      <div class="market-time">11:20 AM – 12:20 PM</div>

      <div class="status closed">CLOSED</div>

      <button class="action open">OPEN MARKET</button>
    </div>

    <div class="market-card open">
      <div class="market-name">MADHUR NIGHT</div>
      <div class="market-time">11:20 PM – 02:20 AM</div>

      <div class="status open">LIVE 🔥</div>

      <button class="action close">CLOSE MARKET</button>
    </div>

    <div class="market-card closed">
      <div class="market-name">SRIDEVI MORNING</div>
      <div class="market-time">08:30 AM – 09:30 AM</div>

      <div class="status closed">CLOSED</div>

      <button class="action open">OPEN MARKET</button>
    </div>

    <div class="market-card open">
      <div class="market-name">KALYAN NIGHT</div>
      <div class="market-time">09:30 PM – 11:30 PM</div>

      <div class="status open">LIVE 🔥</div>

      <button class="action close">CLOSE MARKET</button>
    </div>

  </div>

</div>

</body>
</html>
