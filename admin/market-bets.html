<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SUPER D • Market Bets</title>
  <link rel="stylesheet" href="market-bets.css">
</head>
<body>

<header class="topbar">
  <div class="brand">SUPER <span>D</span></div>

  <!-- DATE PICKER + BACK -->
  <div class="top-actions">
    <input type="date" id="betDate">
    <button class="back" onclick="goBack()">⬅ Back</button>
  </div>
</header>

<div class="page">

  <h1 id="marketTitle">Market Bets</h1>
  <p class="subtitle">Live bet summary (Akhar & Jodi)</p>

  <!-- AKHAR -->
  <section class="section">
    <h2>🎯 AKHAR (0 - 9)</h2>
    <div class="grid akhar-grid" id="akharGrid"></div>
  </section>

  <!-- JODI -->
  <section class="section">
    <h2>🎲 JODI (00 - 99)</h2>
    <div class="grid jodi-grid" id="jodiGrid"></div>
  </section>

  <!-- BET TABLE -->
  <section class="section">
    <h2>📋 Bet Details (Selected Date)</h2>

    <table class="bet-table">
      <thead>
        <tr>
          <th>User</th>
          <th>Type</th>
          <th>Number</th>
          <th>Amount</th>
          <th>Time</th>
        </tr>
      </thead>
      <tbody id="betTableBody"></tbody>
    </table>
  </section>

</div>

<script>
const API = "https://matka-backend-4fy1.onrender.com";
const params = new URLSearchParams(window.location.search);
const marketName = decodeURIComponent(params.get("market"));

document.getElementById("marketTitle").innerText = marketName;

const akharGrid = document.getElementById("akharGrid");
const jodiGrid  = document.getElementById("jodiGrid");
const betDateInput = document.getElementById("betDate");
const betTableBody = document.getElementById("betTableBody");

/* ===== TODAY DATE (YYYY-MM-DD) ===== */
function todayYMD() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
betDateInput.value = todayYMD();

/* ===== INIT AKHAR GRID ===== */
for (let i = 0; i <= 9; i++) {
  akharGrid.innerHTML += `
    <div class="cell">
      <span class="num">${i}</span>
      <span class="amt" id="akhar-${i}">0</span>
    </div>
  `;
}

/* ===== INIT JODI GRID ===== */
for (let i = 0; i < 100; i++) {
  const num = i.toString().padStart(2, "0");
  jodiGrid.innerHTML += `
    <div class="cell small">
      <span class="num">${num}</span>
      <span class="amt" id="jodi-${num}">0</span>
    </div>
  `;
}

/* ===== LOAD BETS (DATE WISE) ===== */
function loadBets() {
  const selectedDate = betDateInput.value;

  fetch(
    API + "/api/bets?market=" + encodeURIComponent(marketName) + "&date=" + selectedDate,
    { cache: "no-store" }
  )
    .then(res => res.json())
    .then(data => {

      /* RESET GRID */
      for (let i = 0; i <= 9; i++) {
        document.getElementById("akhar-" + i).innerText = "0";
      }
      for (let i = 0; i < 100; i++) {
        document.getElementById("jodi-" + i.toString().padStart(2,"0")).innerText = "0";
      }

      /* RESET TABLE */
      betTableBody.innerHTML = "";

      /* FILL AKHAR */
      if (data.akhar) {
        Object.entries(data.akhar).forEach(([digit, amount]) => {
          const el = document.getElementById("akhar-" + digit);
          if (el) el.innerText = amount;
        });
      }

      /* FILL JODI */
      if (data.jodi) {
        Object.entries(data.jodi).forEach(([digit, amount]) => {
          const el = document.getElementById("jodi-" + digit);
          if (el) el.innerText = amount;
        });
      }

      /* FILL TABLE */
      if (data.logs) {
        data.logs.forEach(log => {
          betTableBody.innerHTML += `
            <tr>
              <td>${log.username}</td>
              <td>${log.gameType}</td>
              <td>${log.number}</td>
              <td>₹ ${log.amount}</td>
              <td>${new Date(log.time).toLocaleTimeString()}</td>
            </tr>
          `;
        });
      }
    })
    .catch(err => console.error("BET FETCH ERROR", err));
}

/* EVENTS */
betDateInput.addEventListener("change", loadBets);

/* AUTO REFRESH */
loadBets();
setInterval(loadBets, 5000);

function goBack() {
  history.back();
}
</script>

</body>
</html>
