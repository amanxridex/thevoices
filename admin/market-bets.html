<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SUPER D • Market Bets</title>
  <link rel="stylesheet" href="market-bets.css">
</head>
<body>

<header class="topbar">
  <div class="brand">SUPER <span>D</span></div>

  <div class="top-actions">
    <input type="date" id="betDate">
    <button class="back" onclick="goBack()">⬅ Back</button>
  </div>
</header>

<div class="page">

  <h1 id="marketTitle">Market Bets</h1>
  <p class="subtitle">Live bet summary (Akhar & Jodi)</p>

  <!-- AKHAR -->
  <section class="section">
    <h2>🎯 AKHAR (0 - 9)</h2>
    <div class="grid akhar-grid" id="akharGrid"></div>
  </section>

  <!-- JODI -->
  <section class="section">
    <h2>🎲 JODI (00 - 99)</h2>
    <div class="grid jodi-grid" id="jodiGrid"></div>
  </section>

  <!-- BET LOG -->
  <section class="section">
    <h2>📋 Bet Logs (Selected Date)</h2>
    <table class="bet-table">
      <thead>
        <tr>
          <th>User</th>
          <th>Type</th>
          <th>Number</th>
          <th>Amount</th>
          <th>Time</th>
        </tr>
      </thead>
      <tbody id="betLog"></tbody>
    </table>
  </section>

</div>

<script>
const API = "https://matka-backend-4fy1.onrender.com";
const params = new URLSearchParams(window.location.search);
const marketName = decodeURIComponent(params.get("market"));

document.getElementById("marketTitle").innerText = marketName;

const akharGrid = document.getElementById("akharGrid");
const jodiGrid  = document.getElementById("jodiGrid");
const betLog    = document.getElementById("betLog");
const betDateInput = document.getElementById("betDate");

/* IST SAFE DATE */
function toYMD(date) {
  const d = new Date(date);
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const dayոթ = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

/* DEFAULT DATE = TODAY */
betDateInput.value = toYMD(new Date());

/* INIT AKHAR */
for (let i = 0; i <= 9; i++) {
  akharGrid.innerHTML += `
    <div class="cell">
      <span class="num">${i}</span>
      <span class="amt" id="akhar-${i}">0</span>
    </div>
  `;
}

/* INIT JODI */
for (let i = 0; i < 100; i++) {
  const num = i.toString().padStart(2, "0");
  jodiGrid.innerHTML += `
    <div class="cell small">
      <span class="num">${num}</span>
      <span class="amt" id="jodi-${num}">0</span>
    </div>
  `;
}

/* LOAD BETS */
function loadBets() {
  const selectedDate = betDateInput.value;

  fetch(
    API + "/api/bets?market=" + encodeURIComponent(marketName) + "&_=" + Date.now(),
    { cache: "no-store" }
  )
    .then(res => res.json())
    .then(resData => {

      const records = Array.isArray(resData)
        ? resData
        : (resData.logs || []);

      // reset
      for (let i = 0; i <= 9; i++) {
        document.getElementById("akhar-" + i).innerText = "0";
      }
      for (let i = 0; i < 100; i++) {
        document.getElementById("jodi-" + i.toString().padStart(2,"0")).innerText = "0";
      }
      betLog.innerHTML = "";

      records.forEach(entry => {
        if (toYMD(entry.date) !== selectedDate) return;

        entry.bets.forEach(b => {

          if (entry.gameType === "AKHAR") {
            const el = document.getElementById("akhar-" + b.digit);
            el.innerText = parseInt(el.innerText) + b.amount;
          }

          if (entry.gameType === "JODI") {
            const el = document.getElementById("jodi-" + b.digit);
            el.innerText = parseInt(el.innerText) + b.amount;
          }

          betLog.innerHTML += `
            <tr>
              <td>${entry.createdBy || "-"}</td>
              <td>${entry.gameType}</td>
              <td>${b.digit}</td>
              <td>₹ ${b.amount}</td>
              <td>${new Date(entry.date).toLocaleTimeString()}</td>
            </tr>
          `;
        });
      });
    })
    .catch(err => console.error("BET FETCH ERROR:", err));
}

/* EVENTS */
betDateInput.addEventListener("change", loadBets);

/* AUTO */
loadBets();
setInterval(loadBets, 5000);

function goBack() {
  history.back();
}
</script>

</body>
</html>
