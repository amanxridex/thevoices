<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SUPER D • Sub Admin Login</title>
  <link rel="stylesheet" href="subadmin-login.css">
</head>
<body>

<div class="login-wrapper">
  <div class="login-box">
    <h1 class="brand">SUPER <span>D</span></h1>
    <h2>Sub Admin Login</h2>

    <input type="text" id="username" placeholder="Sub Admin Username">

    <div class="password-box">
      <input type="password" id="password" placeholder="Password">
      <span class="eye" onclick="togglePassword()">👁️</span>
    </div>

    <button onclick="loginSubAdmin()">LOGIN</button>
    <p id="error"></p>
  </div>
</div>

<script>
const API = "https://matka-backend-4fy1.onrender.com";

function togglePassword() {
  const pass = document.getElementById("password");
  pass.type = pass.type === "password" ? "text" : "password";
}

function loginSubAdmin() {
  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;
  const error = document.getElementById("error");

  fetch(API + "/subadmin/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username, password })
  })
  .then(res => res.json())
  .then(data => {
    if (data.token) {
      localStorage.setItem("subToken", data.token);
      localStorage.setItem("subUsername", data.username);

      // same /admin folder
      window.location.href = "subadmin-dashboard.html";
    } else {
      error.innerText = "Invalid credentials";
    }
  })
  .catch(() => {
    error.innerText = "Server error";
  });
}
</script>

</body>
</html>
