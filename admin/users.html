<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SUPER D • User Wallet Control</title>
  <link rel="stylesheet" href="users.css">
</head>
<body>

<!-- TOP BAR -->
<header class="topbar">
  <div class="logo">SUPER <span>D</span></div>
  <button class="logout">Logout</button>
</header>

<div class="page">

  <h1 class="title">💰 User Wallet Control</h1>
  <p class="subtitle">Add, deduct & monitor every rupee</p>

  <div class="wallet-panel">

    <!-- LEFT: USER SEARCH & ACTION -->
    <div class="panel-left">
      <label>User ID / Mobile</label>
      <input type="text" placeholder="Enter user id or mobile">

      <label>Current Balance</label>
      <div class="balance-box">₹ 25,480</div>

      <label>Amount</label>
      <input type="number" placeholder="Enter amount">

      <div class="actions">
        <button class="add">➕ ADD BALANCE</button>
        <button class="deduct">➖ DEDUCT BALANCE</button>
      </div>
    </div>

    <!-- RIGHT: ACTIVITY / POWER VIEW -->
    <div class="panel-right">
      <div class="power-title">LAST WALLET ACTIONS</div>

      <div class="log add-log">
        <span>+ ₹5,000</span>
        <small>Admin • 2 mins ago</small>
      </div>

      <div class="log deduct-log">
        <span>- ₹1,200</span>
        <small>Admin • 10 mins ago</small>
      </div>

      <div class="log add-log">
        <span>+ ₹10,000</span>
        <small>Super Admin • Today</small>
      </div>

      <div class="warning">
        ⚠️ Wallet changes are permanent & logged
      </div>
    </div>

  </div>

</div>

</body>
</html>
