<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SUPER D • Play Matka</title>
  <link rel="stylesheet" href="index.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
</head>

<body>

<div class="app">

<!-- ================= TOP HEADER ================= -->
<header class="top-bar">
  <div class="logo">
    SUPER <span>D</span>
  </div>

  <div class="user-info">
    <div class="balance">
      💰 Balance: <b id="userBalance">₹ 0</b>
    </div>
    <div class="user-id">
      👤 <span id="userName"></span>
    </div>
    <button id="logoutBtn" class="logout-btn">Logout</button>
  </div>
</header>

<!-- ================= NAV ================= -->
<nav class="menu">
  <a href="index.html" class="active">PLAY</a>
  <a href="bet-history.html">BET HISTORY</a>
  <a href="results.html">RESULTS</a>
  <a href="balance-history.html">BALANCE HISTORY</a>
</nav>

<!-- ================= DISCLAIMER ================= -->
<div class="disclaimer-bar">
  <div class="disclaimer-text">
  ⚠️ This game is made only for fun & entertainment purposes.
</div>

<div class="bazar-title">POWERED BY SUPER D</div>

<!-- ================= MARKET LIST ================= -->
<div class="market-list" id="marketList">
  <p class="loading">Loading markets...</p>
</div>

</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

  /* ================= AUTH ================= */
  const token = localStorage.getItem("userToken");
  if (!token) {
    location.replace("user-login.html");
    return;
  }

  fetch("https://matka-backend-4fy1.onrender.com/user/me", {
    headers: { Authorization: "Bearer " + token }
  })
  .then(res => {
    if (!res.ok) {
      localStorage.removeItem("userToken");
      location.replace("user-login.html");
      return;
    }
    return res.json();
  })
  .then(user => {
    document.getElementById("userName").innerText = user.username;
    document.getElementById("userBalance").innerText = "₹ " + user.balance;
  });

  /* ================= MARKETS + RESULTS ================= */
  const list = document.getElementById("marketList");
  const today = new Date().toISOString().split("T")[0];

  Promise.all([
    fetch("https://matka-backend-4fy1.onrender.com/api/markets").then(r => r.json()),
    fetch("https://matka-backend-4fy1.onrender.com/api/results").then(r => r.json())
  ])
  .then(([markets, results]) => {

    list.innerHTML = "";

    markets.forEach(market => {

      const isOpen = market.status === "OPEN";

      // ✅ ONLY TODAY RESULT
      const todayResult = results.find(r => {
        const rDate = new Date(r.date).toISOString().split("T")[0];
        return r.market === market.name && rDate === today;
      });

      let resultText = "-----";
      if (!isOpen && todayResult) {
        resultText = todayResult.result;
      }

      const card = document.createElement("div");
      card.className = "market-card " + (isOpen ? "live" : "closed");

      card.innerHTML = `
        <div class="time">${market.openTime}</div>
        <div class="center">
          <h3>${market.name}</h3>
          <p class="${isOpen ? "live-text" : "closed-text"}">
            ${isOpen ? "Betting is Running Now" : "Betting is Closed"}
          </p>
          <p class="result">${resultText}</p>
        </div>
        <div class="time">
          Close Time<br>
          <b>${market.closeTime}</b>
        </div>
      `;

      if (isOpen) {
        card.onclick = () => {
          location.href = `akhar.html?market=${encodeURIComponent(market.name)}`;
        };
      }

      list.appendChild(card);
    });
  })
  .catch(() => {
    list.innerHTML = "<p class='error'>Server not reachable</p>";
  });

  /* ================= LOGOUT ================= */
  document.getElementById("logoutBtn").onclick = () => {
    localStorage.removeItem("userToken");
    location.replace("user-login.html");
  };

});
</script>

</body>
</html>
