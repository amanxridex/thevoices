<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SUPER D • Play Matka</title>
<link rel="stylesheet" href="index.css">
</head>

<body>

<!-- TOP HEADER -->
<header class="top-bar">
  <div class="logo">SUPER <span>D</span></div>

  <div class="user-info">
    <div class="balance">
      💰 Balance: <b>₹ 2,450</b>
    </div>
    <div class="user-id">
      👤 8529637410
    </div>
  </div>
</header>

<!-- NAV -->
<nav class="menu">
  <span class="active">PLAY</span>
  <span>BET HISTORY</span>
  <span>RESULTS</span>
</nav>

<!-- TITLE -->
<div class="bazar-title">MATKA BAZAR</div>

<!-- MARKET LIST (🔥 DO NOT TOUCH ID 🔥) -->
<div class="market-list" id="marketList">
  <p class="loading">Loading markets...</p>
</div>

<!-- 🔥 JS EXACT SAME (UNCHANGED) -->
<script>
document.addEventListener("DOMContentLoaded", function () {

  const API_URL = "https://matka-backend-4fy1.onrender.com/api/markets";
  const list = document.getElementById("marketList");

  if (!list) return;

  fetch(API_URL)
    .then(res => res.json())
    .then(markets => {
      list.innerHTML = "";

      markets.forEach(market => {
        let statusClass = "closed";
        let statusText = "Betting is Closed for Today";

        if (market.status === "OPEN") {
          statusClass = "live";
          statusText = "Betting is Running Now";
        }

        const card = document.createElement("div");
        card.className = `market-card ${statusClass}`;

        card.innerHTML = `
          <div class="time">${market.openTime}</div>

          <div class="center">
            <h3>${market.name}</h3>
            <p class="${statusClass}-text">${statusText}</p>
            <p class="result">${market.status === "OPEN" ? "***-**-***" : "--"}</p>
          </div>

          <div class="time">
            Close Time<br>
            <b>${market.closeTime}</b>
          </div>
        `;

        if (market.status === "OPEN") {
          card.onclick = () => {
            window.location.href = "jodi.html?marketId=" + market._id;
          };
        }

        list.appendChild(card);
      });
    })
    .catch(() => {
      list.innerHTML =
        "<p class='error'>Server not reachable</p>";
    });
});
</script>

</body>
</html>
