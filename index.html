<script>
const API_URL = "https://matka-backend-4fy1.onrender.com/api/markets";

fetch(API_URL)
  .then(res => res.json())
  .then(markets => {
    const list = document.getElementById("marketList");
    list.innerHTML = "";

    markets.forEach(market => {
      let statusClass = "closed";
      let statusText = "Betting is Closed for Today";

      if (market.status === "OPEN") {
        statusClass = "live";
        statusText = "Betting is Running Now";
      }

      const card = document.createElement("div");
      card.className = `market-card ${statusClass}`;

      card.innerHTML = `
        <div class="time">${formatTime(market.openTime)}</div>
        <div class="center">
          <h3>${market.name}</h3>
          <p class="${statusClass}-text">${statusText}</p>
          <p class="result">${market.status === "OPEN" ? "***-**-***" : "--"}</p>
        </div>
        <div class="time">Close Time<br><b>${formatTime(market.closeTime)}</b></div>
      `;

      if (market.status === "OPEN") {
        card.onclick = () => {
          window.location.href = `jodi.html?marketId=${market._id}`;
        };
      }

      list.appendChild(card);
    });
  })
  .catch(err => {
    document.getElementById("marketList").innerHTML =
      "<p style='color:red'>Server not reachable</p>";
    console.error(err);
  });

function formatTime(time) {
  return time;
}
</script>
