<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SUPER D • Play Matka</title>
  <link rel="stylesheet" href="index.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
</head>

<body>

<!-- 🔥 APP WRAPPER START -->
<div class="app">

<!-- ================= TOP HEADER ================= -->
<header class="top-bar">
  <div class="logo">
    SUPER <span>D</span>
    <small style="font-size:10px;opacity:.6;display:block">
      powered by super d
    </small>
  </div>

  <div class="user-info">
    <div class="balance">
      💰 Balance: <b id="userBalance">₹ 0</b>
    </div>
    <div class="user-id">
      👤 <span id="userName"></span>
    </div>
    <button id="logoutBtn" class="logout-btn">Logout</button>
  </div>
</header>

<!-- ================= NAV ================= -->
<nav class="menu">
  <a href="index.html" class="active">PLAY</a>
  <a href="bet-history.html">BET HISTORY</a>
  <a href="results.html">RESULTS</a>
  <a href="balance-history.html">BALANCE HISTORY</a>
</nav>

<!-- ================= DISCLAIMER ================= -->
<div class="disclaimer-bar">
  <div class="disclaimer-text">
    ⚠️ This game is made only for fun & entertainment purposes.
    No real money gaming is involved.
    This platform does not promote gambling. ⚠️
  </div>
</div>

<!-- ================= TITLE ================= -->
<div class="bazar-title">POWERED BY SUPER D</div>

<!-- ================= MARKET LIST ================= -->
<div class="market-list" id="marketList">
  <p class="loading">Loading markets...</p>
</div>

</div>
<!-- 🔥 APP WRAPPER END -->

<!-- ================= AUTH + USER INFO + MARKETS ================= -->
<script>
document.addEventListener("DOMContentLoaded", () => {
  const token = localStorage.getItem("userToken");

  if (!token) {
    location.replace("user-login.html");
    return;
  }

  fetch("https://matka-backend-4fy1.onrender.com/user/me", {
    headers: {
      Authorization: "Bearer " + token
    }
  })
  .then(res => {
    if (!res.ok) {
      localStorage.removeItem("userToken");
      location.replace("user-login.html");
      return;
    }
    return res.json();
  })
  .then(user => {
    if (!user) return;
    document.getElementById("userName").innerText = user.username;
    document.getElementById("userBalance").innerText = "₹ " + user.balance;
  });

  const list = document.getElementById("marketList");

  fetch("https://matka-backend-4fy1.onrender.com/api/markets")
    .then(res => res.json())
    .then(markets => {
      list.innerHTML = "";

      markets.forEach(market => {
        const isOpen = market.status === "OPEN";

        const card = document.createElement("div");
        card.className = "market-card " + (isOpen ? "live" : "closed");

        card.innerHTML = `
          <div class="time">${market.openTime}</div>
          <div class="center">
            <h3>${market.name}</h3>
            <p class="${isOpen ? "live-text" : "closed-text"}">
              ${isOpen ? "Betting is Running Now" : "Betting is Closed"}
            </p>
            <p class="result">${isOpen ? "***-**-***" : "--"}</p>
          </div>
          <div class="time">
            Close Time<br>
            <b>${market.closeTime}</b>
          </div>
        `;

        if (isOpen) {
          card.onclick = () => {
            location.href = `akhar.html?market=${encodeURIComponent(market.name)}`;
          };
        }

        list.appendChild(card);
      });
    })
    .catch(() => {
      list.innerHTML = "<p class='error'>Server not reachable</p>";
    });
});
</script>

<script>
document.addEventListener("DOMContentLoaded", () => {

  /* existing code already here */

  // 🔐 LOGOUT HANDLER
  const logoutBtn = document.getElementById("logoutBtn");

  logoutBtn.addEventListener("click", () => {
    localStorage.removeItem("userToken");
    location.replace("user-login.html");
  });

});
</script>

</body>
</html>
