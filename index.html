<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SUPER D • Play Matka</title>
<link rel="stylesheet" href="index.css">

<!-- 🔐 AUTH GUARD -->
<script>
  const userToken = localStorage.getItem("userToken");
  if (!userToken) {
    location.href = "user-login.html";
  }
</script>
</head>

<body>

<!-- TOP HEADER -->
<header class="top-bar">
  <div class="logo">SUPER <span>D</span></div>

  <div class="user-info">
    <div class="balance">
      💰 Balance: <b id="userBalance">₹ 0</b>
    </div>
    <div class="user-id">
      👤 <span id="userName"></span>
    </div>
  </div>
</header>

<!-- NAV -->
<nav class="menu">
  <span class="active">PLAY</span>
  <span>BET HISTORY</span>
  <span>RESULTS</span>
  <span>BALANCE HISTORY</span>
</nav>

<!-- DISCLAIMER TICKER -->
<div class="disclaimer-bar">
  <div class="disclaimer-text">
    ⚠️ This game is made only for fun & entertainment purposes. 
    No real money gaming is involved. 
    This platform does not promote gambling. ⚠️
  </div>
</div>

<!-- TITLE -->
<div class="bazar-title">POWERED BY SUPER D</div>

<!-- MARKET LIST (🔥 DO NOT TOUCH ID 🔥) -->
<div class="market-list" id="marketList">
  <p class="loading">Loading markets...</p>
</div>

<!-- ================= USER INFO ================= -->
<script>
const API = "https://matka-backend-4fy1.onrender.com";
const token = localStorage.getItem("userToken");

fetch(API + "/user/me", {
  headers: {
    Authorization: "Bearer " + token
  }
})
.then(res => {
  if (!res.ok) {
    localStorage.clear();
    location.href = "user-login.html";
    return;
  }
  return res.json();
})
.then(user => {
  if (!user) return;
  document.getElementById("userName").innerText = user.username;
  document.getElementById("userBalance").innerText = "₹ " + user.balance;
});
</script>

<!-- ================= MARKET LIST (UNCHANGED) ================= -->
<script>
document.addEventListener("DOMContentLoaded", function () {

  const API_URL = "https://matka-backend-4fy1.onrender.com/api/markets";
  const list = document.getElementById("marketList");

  if (!list) return;

  fetch(API_URL)
    .then(res => res.json())
    .then(markets => {
      list.innerHTML = "";

      markets.forEach(market => {
        let statusClass = "closed";
        let statusText = "Betting is Closed for Today";

        if (market.status === "OPEN") {
          statusClass = "live";
          statusText = "Betting is Running Now";
        }

        const card = document.createElement("div");
        card.className = `market-card ${statusClass}`;

        card.innerHTML = `
          <div class="time">${market.openTime}</div>

          <div class="center">
            <h3>${market.name}</h3>
            <p class="${statusClass}-text">${statusText}</p>
            <p class="result">${market.status === "OPEN" ? "***-**-***" : "--"}</p>
          </div>

          <div class="time">
            Close Time<br>
            <b>${market.closeTime}</b>
          </div>
        `;

        if (market.status === "OPEN") {
          card.onclick = () => {
            window.location.href = "jodi.html?marketId=" + market._id;
          };
        }

        list.appendChild(card);
      });
    })
    .catch(() => {
      list.innerHTML = "<p class='error'>Server not reachable</p>";
    });
});
</script>

</body>
</html>
